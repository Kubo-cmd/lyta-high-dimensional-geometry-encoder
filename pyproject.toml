[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyta-high-dimensional-geometry-encoder"
version = "0.1.0"
description = "Deterministic spherical-code and random-projection experiments"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["spherical-codes", "simplex", "random-projection", "geometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lyta-geometry-encoder = "lyta_geometry_encoder:main"

[project.urls]
Homepage = "https://github.com/Kubo-cmd/lyta-high-dimensional-geometry-encoder"
Issues = "https://github.com/Kubo-cmd/lyta-high-dimensional-geometry-encoder/issues"

[tool.setuptools]
py-modules = ["lyta_geometry_encoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
